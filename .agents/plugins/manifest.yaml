schemaVersion: 1
plugins:
  linear:
    example: linear.example.yaml
    auth: external-connector
    permissions: [issues:read-write, projects:read-write, comments:read-write]
  gmail:
    example: gmail.example.yaml
    auth: external-connector
    permissions: [profile:read, mail:read, mail:send-explicit-only]
  github:
    example: github.example.yaml
    auth: external-connector
    permissions: [repository:read, issues:read-write, pull-requests:read-write]
  ai-memory:
    example: ai-memory.example.yaml
    auth: local-service-or-external-connector
    permissions: [project-memory:read-write, lifecycle-events:write]
