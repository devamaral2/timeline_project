services:
  auth-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: timeline_auth_test
      POSTGRES_USER: auth_test
      POSTGRES_PASSWORD: auth_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_test -d timeline_auth_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
