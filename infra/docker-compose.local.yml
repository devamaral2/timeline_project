# PostgreSQL local do modelo antigo. A API e o Auth usam SQLite (ADR 0024 e 0025)
# e nao precisam dele: serve a copia unica dos dados do Auth e ao teardown de uma
# worktree que ainda tem COMPOSE_PROJECT_NAME. O bind em 127.0.0.1 mantem o
# banco fora da rede.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54391}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

networks:
  data:
