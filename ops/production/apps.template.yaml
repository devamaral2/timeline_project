apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: braid
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: braid-api:REPLACE_SHA
          imagePullPolicy: Never
          envFrom:
            - secretRef: {name: onepassword-loader}
          ports:
            - {containerPort: 3001}
          startupProbe:
            tcpSocket: {port: 3001}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: 3001}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 3001}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: braid
spec:
  type: ClusterIP
  selector: {app: api}
  ports:
    - {port: 3001, targetPort: 3001}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: braid
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: braid-web:REPLACE_SHA
          imagePullPolicy: Never
          env:
            - {name: NODE_ENV, value: production}
            - {name: AUTH_SERVICE_URL, value: http://auth.braid.svc.cluster.local:3002}
          ports:
            - {containerPort: 3000}
          startupProbe:
            httpGet: {path: /, port: 3000}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /, port: 3000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 3000}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: braid
spec:
  type: ClusterIP
  selector: {app: web}
  ports:
    - {port: 3000, targetPort: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: braid
spec:
  replicas: 1
  selector:
    matchLabels: {app: auth}
  template:
    metadata:
      labels: {app: auth}
    spec:
      containers:
        - name: auth
          image: braid-auth:REPLACE_SHA
          imagePullPolicy: Never
          envFrom:
            - secretRef: {name: onepassword-loader}
          ports:
            - {containerPort: 3002}
          startupProbe:
            httpGet: {path: /health/live, port: 3002}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: 3002}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /health/live, port: 3002}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: braid
spec:
  type: ClusterIP
  selector: {app: auth}
  ports:
    - {port: 3002, targetPort: 3002}
